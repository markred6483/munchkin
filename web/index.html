<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gioco P2P con PeerJS</title>

    <!-- Foglio di stile CSS esterno -->
    <link rel="stylesheet" href="style.css">

    <!-- Script JS nel Head (type="module" non blocca il rendering del DOM) -->
    <script type="module" src="game.js"></script>
</head>
<body>

<h1>Demo P2P Multi-Giocatore</h1>

<!-- SEZIONE LOBBY -->
<div id="lobby" class="lobby">
    <input type="text" id="room-input" placeholder="Inserisci il nome della stanza..." />
    <br>
    <button id="btn-create">Crea Nuova Stanza</button>
    <button id="btn-join">Unisciti alla Stanza</button>
</div>

<!-- SEZIONE GIOCO -->
<p>Il tuo ID: <span id="my-id">Scollegato</span></p>
<p>Stato: <span id="status">Scegli o crea una stanza per iniziare</span></p>

<canvas id="canvas" width="600" height="400"></canvas>

</body>
</html>
