<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gioco P2P con PeerJS</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 30px; }
        #status { font-weight: bold; color: #007acc; }
        #canvas { border: 2px solid #333; background: #f9f9f9; cursor: crosshair; display: none; margin: 20px auto; }
        .lobby { background: #f0f0f0; padding: 20px; border-radius: 8px; display: inline-block; }
        input, button { font-size: 16px; padding: 8px 12px; margin: 5px; }
        button { cursor: pointer; background: #007acc; color: white; border: none; border-radius: 4px; }
        button:hover { background: #005999; }
    </style>
</head>
<body>

<h1>Demo P2P Multi-Giocatore</h1>

<!-- SEZIONE LOBBY (scelta della stanza) -->
<div id="lobby" class="lobby">
    <input type="text" id="room-input" placeholder="Inserisci il nome della stanza..." />
    <br>
    <button id="btn-create">Crea Nuova Stanza</button>
    <button id="btn-join">Unisciti alla Stanza</button>
</div>

<!-- SEZIONE DI GIOCO -->
<p>Il tuo ID: <span id="my-id">Scollegato</span></p>
<p>Stato: <span id="status">Scegli o crea una stanza per iniziare</span></p>

<canvas id="canvas" width="600" height="400"></canvas>

<script type="module" src="game.js"></script>
</body>
</html>
